<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nail Vocab Super App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; text-align: center; color: #333;}
        .header { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        
        /* BỘ CHỌN ĐA NGÔN NGỮ */
        .lang-selector { background: white; padding: 15px 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border: 2px solid #2ecc71;}
        .lang-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 10px; }
        .lang-options { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { padding: 8px 15px; border: 2px solid #ccc; border-radius: 20px; background: white; color: #777; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s;}
        .lang-btn.selected { background: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 2px 5px rgba(46, 204, 113, 0.4);}

        #main-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-card { background: white; padding: 20px 10px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border-bottom: 4px solid #ddd;}
        .menu-card:active { transform: translateY(4px); border-bottom: 0; }
        .menu-icon { font-size: 30px; margin-bottom: 10px; }
        .menu-title { font-weight: bold; font-size: 14px; }

        .screen { display: none; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 300px; position: relative;}
        .active-screen { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity: 0; transform: scale(0.95);} to {opacity: 1; transform: scale(1);} }
        
        .btn-back { position: absolute; top: 15px; left: 15px; background: #ecf0f1; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .word-display { font-size: 28px; font-weight: bold; color: #e74c3c; margin: 40px 0 5px 0; }
        .lang-hint { font-size: 14px; font-weight: bold; color: #3498db; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;}
        
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-warning { background: #f1c40f; color: #333; }
        
        .quiz-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .quiz-btn { background: #f8f9fa; border: 2px solid #bdc3c7; color: #2c3e50; }
        .quiz-btn.correct { background: #2ecc71; border-color: #27ae60; color: white; }
        .quiz-btn.wrong { background: #e74c3c; border-color: #c0392b; color: white; }

        input { width: 90%; padding: 15px; border: 2px solid #bdc3c7; border-radius: 10px; font-size: 18px; text-align: center; outline: none; margin-bottom: 15px;}
        input:focus { border-color: #3498db; }

        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .match-btn { padding: 15px 5px; border: 2px solid #bdc3c7; border-radius: 10px; background: white; font-size: 14px; font-weight: bold; cursor: pointer; }
        .match-btn.selected { border-color: #3498db; background: #e8f4f8; }
        .match-btn.matched { opacity: 0; pointer-events: none; }

        .extra-info { font-size: 13px; color: #7f8c8d; margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px; display: none; line-height: 1.5;}
        
        /* CSS cho phần phiên âm nằm ngang */
        .pronunciation-text { color: #7f8c8d; font-weight: normal; font-size: 0.9em; margin-left: 6px; font-style: italic;}
    </style>
</head>
<body>

    <div class="header">💅 Nail Vocab Master</div>
    <div id="loading">⏳ Đang tải dữ liệu từ máy chủ...</div>

    <!-- MÀN HÌNH MENU CHÍNH -->
    <div id="screen-menu" class="screen active-screen" style="background: transparent; box-shadow: none; padding: 0;">
        
        <div class="lang-selector">
            <div class="lang-title">Chọn các ngôn ngữ muốn luyện tập:</div>
            <div class="lang-options" id="dynamic-lang-options">
                <!-- Nút bấm sẽ tự động xuất hiện -->
            </div>
        </div>

        <div id="main-menu">
            <div class="menu-card" style="border-color: #3498db;" onclick="openScreen('screen-type')">
                <div class="menu-icon">⌨️</div><div class="menu-title">Luyện Gõ</div>
            </div>
            <div class="menu-card" style="border-color: #9b59b6;" onclick="openScreen('screen-match')">
                <div class="menu-icon">🎮</div><div class="menu-title">Nối Từ</div>
            </div>
            <div class="menu-card" style="border-color: #e67e22;" onclick="openScreen('screen-quiz')">
                <div class="menu-icon">🎯</div><div class="menu-title">Trắc Nghiệm</div>
            </div>
            <div class="menu-card" style="border-color: #e74c3c;" onclick="openScreen('screen-listen')">
                <div class="menu-icon">🎧</div><div class="menu-title">Nghe Mù</div>
            </div>
            <div class="menu-card" style="border-color: #2ecc71; grid-column: span 2;" onclick="openScreen('screen-speak')">
                <div class="menu-icon">🎤</div><div class="menu-title">AI Luyện Nói</div>
            </div>
        </div>
    </div>

    <!-- CÁC MÀN HÌNH GAME -->
    <div id="screen-type" class="screen">
        <button class="btn-back" onclick="openScreen('screen-menu')">⬅ Quay lại</button>
        <div class="word-display" id="type-vi">Tiếng Việt</div>
        <div class="lang-hint" id="type-hint">Đang tải...</div>
        <input type="text" id="type-input" placeholder="Gõ đáp án vào đây...">
        <button class="btn-action btn-success" onclick="checkType()">Kiểm tra</button>
        <button class="btn-action btn-warning" onclick="loadType()">Bỏ qua ➡️</button>
        <div id="type-result" style="font-weight: bold; margin-top: 10px;"></div>
        <div id="type-extra" class="extra-info"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <button class="btn-back" onclick="openScreen('screen-menu')">⬅ Quay lại</button>
        <div class="word-display" id="quiz-vi">Tiếng Việt</div>
        <div class="lang-hint" id="quiz-hint">Đang tải...</div>
        <div class="quiz-grid" id="quiz-options"></div>
        <div id="quiz-result" style="font-weight: bold; margin-top: 10px;"></div>
        <div id="quiz-extra" class="extra-info"></div>
    </div>

    <div id="screen-listen" class="screen">
        <button class="btn-back" onclick="openScreen('screen-menu')">⬅ Quay lại</button>
        <div style="margin: 50px 0 10px 0;">
            <button class="btn-action btn-primary" style="font-size: 50px; padding: 20px; border-radius: 50%; width: 100px; height: 100px;" onclick="playCurrentAudio()">🔊</button>
        </div>
        <div class="lang-hint" id="listen-hint" style="margin-bottom: 20px;">Đang tải...</div>
        <input type="text" id="listen-input" placeholder="Bạn nghe được chữ gì?">
        <button class="btn-action btn-success" onclick="checkListen()">Kiểm tra</button>
        <button class="btn-action btn-warning" onclick="loadListen()">Bỏ qua ➡️</button>
        <div id="listen-result" style="font-weight: bold; margin-top: 10px;"></div>
        <div id="listen-extra" class="extra-info"></div>
    </div>

    <div id="screen-speak" class="screen">
        <button class="btn-back" onclick="openScreen('screen-menu')">⬅ Quay lại</button>
        <div class="word-display" id="speak-target" style="color: #2980b9;">Word</div>
        <div class="lang-hint" id="speak-hint">Đang tải...</div>
        <div style="font-size: 16px; color: #7f8c8d; margin-bottom: 20px;" id="speak-vi">Nghĩa tiếng Việt</div>
        <button class="btn-action btn-success" id="btn-mic" style="font-size: 20px; padding: 20px;" onclick="startDictation()">🎤 Bấm để Nói</button>
        <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
            <div>Máy nghe được: <b id="speak-transcript" style="color: #e67e22;">...</b></div>
        </div>
        <div id="speak-result" style="font-weight: bold; margin-top: 10px; font-size: 18px;"></div>
        <button class="btn-action btn-warning" style="margin-top: 15px;" onclick="loadSpeak()">Từ tiếp theo ➡️</button>
    </div>

    <div id="screen-match" class="screen">
        <button class="btn-back" onclick="openScreen('screen-menu')">⬅ Quay lại</button>
        <div style="margin-top: 40px; font-size: 14px; color: #666; margin-bottom: 10px;">Ghép cặp Việt - Đa ngôn ngữ</div>
        <div class="match-grid" id="match-board"></div>
        <button class="btn-action btn-primary" style="margin-top: 20px;" onclick="loadMatch()">🔄 Ván mới</button>
    </div>

    <script>
        // --- THAY LINK API CỦA BẠN VÀO DÒNG BÊN DƯỚI ---
        const API_URL = "https://script.google.com/macros/s/AKfycbxuzIud6IQd33JSHi_0xB7mpMQ2SNKbwCrvia1mEwei4R5WTJJVtNvwOvFQpPH77iJFMg/exec"; 
        
        let vocabList = [];
        let currentWord = {};
        
        let activeLangs = []; 
        let allAvailableLangs = [];
        let currentLangForTurn = ''; 

        const langConfig = {
            'en': { name: 'Tiếng Anh', flag: '🇬🇧', speechCode: 'en-US' },
            'tl': { name: 'Tagalog', flag: '🇵🇭', speechCode: 'tl-PH' },
            'ilo': { name: 'Ilocano', flag: '🌴', speechCode: null },
            'ko': { name: 'Tiếng Hàn', flag: '🇰🇷', speechCode: 'ko-KR' },
            'zh': { name: 'Tiếng Trung', flag: '🇨🇳', speechCode: 'zh-CN' },
            'ja': { name: 'Tiếng Nhật', flag: '🇯🇵', speechCode: 'ja-JP' }
        };

        // 1. TẢI DỮ LIỆU
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                vocabList = data;
                document.getElementById('loading').style.display = 'none';
                buildLanguageSelector();
            });

        // 2. TẠO NÚT MULTI-SELECT
        function buildLanguageSelector() {
            if(vocabList.length === 0) return;
            let allColumns = Object.keys(vocabList[0]);
            allAvailableLangs = allColumns.filter(col => col !== 'vi' && col !== 'en_pronunciation');

            let html = '';
            allAvailableLangs.forEach((lang, index) => {
                let config = langConfig[lang] || { name: lang.toUpperCase(), flag: '🏳️' };
                activeLangs.push(lang);
                html += `<button class="lang-btn selected" id="btn-lang-${lang}" onclick="toggleLanguage('${lang}')">
                            ${config.flag} ${config.name}
                         </button>`;
            });
            document.getElementById('dynamic-lang-options').innerHTML = html;
        }

        function toggleLanguage(lang) {
            let index = activeLangs.indexOf(lang);
            let btn = document.getElementById('btn-lang-' + lang);
            
            if (index > -1) {
                if (activeLangs.length === 1) { alert("Bạn phải chọn ít nhất 1 ngôn ngữ để học!"); return; }
                activeLangs.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                activeLangs.push(lang);
                btn.classList.add('selected');
            }
        }

        function pickRandomActiveLang() {
            return activeLangs[Math.floor(Math.random() * activeLangs.length)];
        }

        function getLangName(langCode) {
            return langConfig[langCode] ? langConfig[langCode].name : langCode.toUpperCase();
        }

        // --- HÀM ĐỊNH DẠNG TỪ (GHÉP PHIÊN ÂM NẰM NGANG) ---
        function formatWordWithPronunciation(wordObj, langCode) {
            let text = wordObj[langCode] || '...';
            // Kiểm tra: Nếu là tiếng Anh VÀ có dữ liệu ở cột en_pronunciation
            if (langCode === 'en' && wordObj.en_pronunciation && wordObj.en_pronunciation.trim() !== '') {
                // Trả về: Chữ tiếng Anh + (Phiên âm) nằm trên cùng 1 hàng
                return `${text} <span class="pronunciation-text">(${wordObj.en_pronunciation})</span>`;
            }
            return text;
        }

        function getExtraInfoHTML() {
            let html = ``;
            let translations = allAvailableLangs.map(l => {
                let name = getLangName(l);
                let text = currentWord[l] || '...';
                if(l === 'en' && currentWord.en_pronunciation) {
                    text += ` <span style="color:#e67e22">(${currentWord.en_pronunciation})</span>`;
                }
                return `<b>${name}:</b> ${text}`;
            });
            return html + translations.join('<br>');
        }

        // --- CÁC HÀM CHUNG ---
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
            document.querySelectorAll('.extra-info').forEach(el => el.style.display = 'none');

            if(screenId === 'screen-type') loadType();
            if(screenId === 'screen-quiz') loadQuiz();
            if(screenId === 'screen-listen') loadListen();
            if(screenId === 'screen-speak') loadSpeak();
            if(screenId === 'screen-match') loadMatch();
        }

        function getRandomWord() { return vocabList[Math.floor(Math.random() * vocabList.length)]; }
        
        function playCurrentAudio() {
            let config = langConfig[currentLangForTurn];
            if(!config || !config.speechCode) {
                alert(`Hệ thống chưa hỗ trợ giọng đọc AI cho ${getLangName(currentLangForTurn)}.`); return;
            }
            let u = new SpeechSynthesisUtterance(currentWord[currentLangForTurn]);
            u.lang = config.speechCode;
            window.speechSynthesis.speak(u);
        }

        // --- MODULE 1: LUYỆN GÕ ---
        function loadType() {
            currentWord = getRandomWord();
            currentLangForTurn = pickRandomActiveLang(); 

            document.getElementById('type-vi').innerText = currentWord.vi;
            
            let hintText = `👉 Hãy gõ ${getLangName(currentLangForTurn)}`;
            if(currentLangForTurn === 'en' && currentWord.en_pronunciation) {
                hintText += ` (Đọc là: ${currentWord.en_pronunciation})`;
            }
            document.getElementById('type-hint').innerText = hintText;
            
            document.getElementById('type-input').value = "";
            document.getElementById('type-result').innerText = "";
            document.getElementById('type-extra').style.display = 'none';
        }
        function checkType() {
            let input = document.getElementById('type-input').value.trim().toLowerCase();
            let answer = (currentWord[currentLangForTurn] || "").toLowerCase();
            if(input === answer && answer !== "") {
                document.getElementById('type-result').innerHTML = "✅ Chính xác!"; document.getElementById('type-result').style.color = "green";
                playCurrentAudio();
                document.getElementById('type-extra').innerHTML = getExtraInfoHTML();
                document.getElementById('type-extra').style.display = 'block';
                setTimeout(loadType, 3000);
            } else {
                document.getElementById('type-result').innerHTML = `❌ Sai! Đáp án: ${currentWord[currentLangForTurn]}`; document.getElementById('type-result').style.color = "red";
            }
        }

        // --- MODULE 2: TRẮC NGHIỆM ---
        function loadQuiz() {
            currentWord = getRandomWord();
            currentLangForTurn = pickRandomActiveLang();

            document.getElementById('quiz-vi').innerText = currentWord.vi;
            document.getElementById('quiz-hint').innerText = `👉 Hãy chọn ${getLangName(currentLangForTurn)}`;
            document.getElementById('quiz-result').innerText = "";
            document.getElementById('quiz-extra').style.display = 'none';
            
            let options = [currentWord];
            while(options.length < 4) {
                let randomW = getRandomWord();
                if(!options.includes(randomW)) options.push(randomW);
            }
            options.sort(() => Math.random() - 0.5);

            let optionsHtml = "";
            options.forEach(opt => {
                // Gọi hàm ghép phiên âm
                let displayText = formatWordWithPronunciation(opt, currentLangForTurn);
                // Dùng thuộc tính data-answer để lưu đáp án gốc (không chứa mã HTML)
                optionsHtml += `<button class="btn-action quiz-btn" onclick="checkQuiz(this, '${opt[currentLangForTurn]}')">${displayText}</button>`;
            });
            document.getElementById('quiz-options').innerHTML = optionsHtml;
        }
        function checkQuiz(btn, selectedWord) {
            if(selectedWord === currentWord[currentLangForTurn]) {
                btn.classList.add('correct');
                document.getElementById('quiz-result').innerHTML = "✅ Giỏi quá!"; document.getElementById('quiz-result').style.color = "green";
                playCurrentAudio();
                document.getElementById('quiz-extra').innerHTML = getExtraInfoHTML();
                document.getElementById('quiz-extra').style.display = 'block';
                setTimeout(loadQuiz, 3000);
            } else {
                btn.classList.add('wrong');
                document.getElementById('quiz-result').innerHTML = "❌ Thử lại nhé!"; document.getElementById('quiz-result').style.color = "red";
            }
        }

        // --- MODULE 3: NGHE MÙ ---
        function loadListen() {
            currentWord = getRandomWord();
            currentLangForTurn = pickRandomActiveLang();

            document.getElementById('listen-hint').innerText = `👉 Đang phát ${getLangName(currentLangForTurn)}`;
            document.getElementById('listen-input').value = "";
            document.getElementById('listen-result').innerText = "";
            document.getElementById('listen-extra').style.display = 'none';
            playCurrentAudio();
        }
        function checkListen() {
            let input = document.getElementById('listen-input').value.trim().toLowerCase();
            let answer = (currentWord[currentLangForTurn] || "").toLowerCase();
            if(input === answer && answer !== "") {
                document.getElementById('listen-result').innerHTML = `✅ Đúng! Nghĩa là: ${currentWord.vi}`; document.getElementById('listen-result').style.color = "green";
                document.getElementById('listen-extra').innerHTML = getExtraInfoHTML();
                document.getElementById('listen-extra').style.display = 'block';
                setTimeout(loadListen, 3000);
            } else {
                document.getElementById('listen-result').innerHTML = `❌ Sai! Nghe lại nhé.`; document.getElementById('listen-result').style.color = "red";
                playCurrentAudio();
            }
        }

        // --- MODULE 4: AI LUYỆN NÓI ---
        function loadSpeak() {
            currentWord = getRandomWord();
            currentLangForTurn = pickRandomActiveLang();

            // Hiển thị từ tiếng Anh + Phiên âm
            document.getElementById('speak-target').innerHTML = formatWordWithPronunciation(currentWord, currentLangForTurn);
            
            document.getElementById('speak-hint').innerText = `👉 Hãy đọc bằng ${getLangName(currentLangForTurn)}`;
            document.getElementById('speak-vi').innerText = currentWord.vi;
            document.getElementById('speak-transcript').innerText = "...";
            document.getElementById('speak-result').innerText = "";
        }
        function startDictation() {
            let config = langConfig[currentLangForTurn];
            if(!config || !config.speechCode) {
                alert(`Hệ thống AI chưa hỗ trợ nhận diện giọng nói cho ${getLangName(currentLangForTurn)}.`); return;
            }
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                var recognition = new SpeechRecognition();
                recognition.continuous = false; recognition.interimResults = false;
                recognition.lang = config.speechCode;
                
                document.getElementById('btn-mic').innerText = "🔴 Đang nghe..."; document.getElementById('btn-mic').style.background = "#e74c3c";
                recognition.start();

                recognition.onresult = function(e) {
                    document.getElementById('btn-mic').innerText = "🎤 Bấm để Nói"; document.getElementById('btn-mic').style.background = "#2ecc71";
                    let transcript = e.results[0][0].transcript.toLowerCase().replace(/[.,?!]/g,"");
                    document.getElementById('speak-transcript').innerText = transcript;
                    let target = (currentWord[currentLangForTurn] || "").toLowerCase().replace(/[.,?!]/g,"");
                    if(transcript === target) {
                        document.getElementById('speak-result').innerHTML = "✅ Phát âm chuẩn!"; document.getElementById('speak-result').style.color = "green";
                        setTimeout(loadSpeak, 2000);
                    } else {
                        document.getElementById('speak-result').innerHTML = "❌ Chưa chuẩn, thử lại!"; document.getElementById('speak-result').style.color = "red";
                    }
                    recognition.stop();
                };
                recognition.onerror = function(e) {
                    document.getElementById('btn-mic').innerText = "🎤 Bấm để Nói"; document.getElementById('btn-mic').style.background = "#2ecc71";
                    alert("Lỗi Micro: " + e.error);
                }
            } else { alert("Trình duyệt không hỗ trợ thu âm."); }
        }

        // --- MODULE 5: NỐI TỪ ---
        let firstSel = null, matches = 0;
        function loadMatch() {
            let board = document.getElementById('match-board'); board.innerHTML = '';
            firstSel = null; matches = 0;
            let shuffled = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 4); 
            let btns = [];
            
            shuffled.forEach(w => {
                let randomLang = pickRandomActiveLang();
                btns.push({ text: w.vi, id: w[randomLang], lang: 'vi' });
                
                // Gọi hàm ghép phiên âm
                let displayText = formatWordWithPronunciation(w, randomLang);
                btns.push({ text: displayText, id: w[randomLang], lang: randomLang });
            });
            
            btns.sort(() => 0.5 - Math.random());
            btns.forEach(item => {
                let btn = document.createElement('button'); btn.className = 'match-btn'; 
                btn.innerHTML = item.text || '...'; // Dùng innerHTML để render thẻ <span>
                btn.onclick = () => handleMatch(btn, item.id, item.lang);
                board.appendChild(btn);
            });
        }
        function handleMatch(btn, id, lang) {
            if(btn.classList.contains('matched') || btn.classList.contains('selected')) return;
            btn.classList.add('selected');
            if(!firstSel) { firstSel = { btn: btn, id: id, lang: lang }; } 
            else {
                if(firstSel.id === id && firstSel.lang !== lang) {
                    firstSel.btn.classList.replace('selected', 'matched'); btn.classList.replace('selected', 'matched');
                    matches++; if(matches === 4) setTimeout(() => { alert("🎉 Hoàn thành!"); loadMatch(); }, 500);
                } else {
                    firstSel.btn.classList.remove('selected'); btn.classList.remove('selected');
                }
                firstSel = null;
            }
        }
    </script>
</body>
</html>
