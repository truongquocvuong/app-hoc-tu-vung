<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super App: Nail & Books</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; text-align: center; color: #333;}
        .header { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
        
        /* MÀN HÌNH CHỌN APP */
        #app-selector { display: flex; flex-direction: column; gap: 20px; margin-top: 50px; }
        .big-btn { padding: 30px; border-radius: 20px; font-size: 20px; font-weight: bold; color: white; border: none; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.15); transition: 0.3s;}
        .big-btn:active { transform: scale(0.95); }
        .btn-nail { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #d63031; border: 2px solid #ff7675;}
        .btn-book { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #4a235a; border: 2px solid #9b59b6;}

        /* CSS CHUNG */
        .screen { display: none; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 300px; position: relative;}
        .active-screen { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity: 0; transform: scale(0.95);} to {opacity: 1; transform: scale(1);} }
        .btn-back { position: absolute; top: 15px; left: 15px; background: #ecf0f1; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 10;}
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px;}
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-warning { background: #f1c40f; color: #333; }
        
        /* MENU CON */
        .sub-menu { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 40px; }
        .menu-card { background: white; padding: 20px; border-radius: 15px; cursor: pointer; border-bottom: 4px solid #ddd; font-weight: bold; font-size: 18px;}
        
        /* CSS CHO PHẦN SÁCH */
        .book-sentence { font-size: 22px; line-height: 1.5; color: #2c3e50; margin: 40px 0 20px 0; font-weight: 500;}
        .cloze-blank { border-bottom: 3px solid #e74c3c; color: transparent; padding: 0 10px; display: inline-block; min-width: 50px; }
        .cloze-input { font-size: 20px; padding: 10px; text-align: center; border: 2px solid #9b59b6; border-radius: 8px; width: 80%; margin-bottom: 20px;}
        
        /* CSS Xếp hình (Scramble) */
        .scramble-area { min-height: 80px; border: 2px dashed #ccc; border-radius: 10px; padding: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;}
        .word-piece { background: #3498db; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; font-size: 16px;}
        .word-piece.selected { background: #95a5a6; }
    </style>
</head>
<body>

    <div class="header">🧠 Super Learning App</div>
    <div id="loading">⏳ Đang tải dữ liệu từ máy chủ...</div>

    <!-- MÀN HÌNH 0: CHỌN APP -->
    <div id="screen-home" class="screen active-screen" style="background: transparent; box-shadow: none;">
        <div id="app-selector">
            <button class="big-btn btn-nail" onclick="alert('Phần Nail tạm ẩn để tập trung test phần Sách. Mình sẽ gộp lại sau nhé!')">💅 HỌC TỪ VỰNG NAIL</button>
            <button class="big-btn btn-book" onclick="openScreen('screen-book-menu')">📚 HỌC TÓM TẮT SÁCH</button>
        </div>
    </div>

    <!-- MÀN HÌNH MENU SÁCH -->
    <div id="screen-book-menu" class="screen">
        <button class="btn-back" onclick="openScreen('screen-home')">⬅ Home</button>
        <div class="sub-menu">
            <div class="menu-card" style="border-color: #e74c3c;" onclick="openScreen('screen-book-cloze')">📝 Phương pháp 1: Điền Khuyết</div>
            <div class="menu-card" style="border-color: #f39c12;" onclick="openScreen('screen-book-trigger')">💡 Phương pháp 2: Từ Khóa Kích Hoạt</div>
            <div class="menu-card" style="border-color: #3498db;" onclick="openScreen('screen-book-scramble')">🧩 Phương pháp 3: Xếp Hình Tư Duy</div>
        </div>
    </div>

    <!-- SÁCH PP1: ĐIỀN KHUYẾT (CLOZE) -->
    <div id="screen-book-cloze" class="screen">
        <button class="btn-back" onclick="openScreen('screen-book-menu')">⬅ Quay lại</button>
        <div class="book-sentence" id="cloze-text">Đang tải...</div>
        <input type="text" id="cloze-input" class="cloze-input" placeholder="Gõ từ khóa bị thiếu...">
        <button class="btn-action btn-success" onclick="checkCloze()">Kiểm tra</button>
        <button class="btn-action btn-warning" onclick="loadCloze()">Bỏ qua ➡️</button>
        <div id="cloze-result" style="font-weight: bold; margin-top: 15px; font-size: 18px;"></div>
    </div>

    <!-- SÁCH PP2: TỪ KHÓA KÍCH HOẠT (TRIGGER) -->
    <div id="screen-book-trigger" class="screen">
        <button class="btn-back" onclick="openScreen('screen-book-menu')">⬅ Quay lại</button>
        <div style="margin-top: 50px; color: #7f8c8d;">Khi thấy từ khóa này, bạn nhớ đến câu nào?</div>
        <div style="font-size: 40px; font-weight: bold; color: #e67e22; margin: 20px 0;" id="trigger-keyword">Từ khóa</div>
        
        <div id="trigger-answer" style="display: none; background: #f8f9fa; padding: 20px; border-radius: 10px; font-size: 20px; color: #2c3e50; border-left: 5px solid #2ecc71; margin-bottom: 20px;">
            Đáp án ở đây
        </div>

        <button class="btn-action btn-primary" id="btn-show-trigger" onclick="showTriggerAnswer()">👀 Xem Đáp Án</button>
        <button class="btn-action btn-warning" style="display: none;" id="btn-next-trigger" onclick="loadTrigger()">Câu tiếp theo ➡️</button>
    </div>

    <!-- SÁCH PP3: XẾP HÌNH TƯ DUY (SCRAMBLE) -->
    <div id="screen-book-scramble" class="screen">
        <button class="btn-back" onclick="openScreen('screen-book-menu')">⬅ Quay lại</button>
        <div style="margin-top: 40px; margin-bottom: 10px; font-weight: bold;">Sắp xếp lại câu:</div>
        
        <!-- Khu vực chứa câu trả lời của người dùng -->
        <div class="scramble-area" id="scramble-answer-area"></div>
        
        <!-- Khu vực chứa các từ lộn xộn -->
        <div class="scramble-area" id="scramble-pool-area" style="border-color: transparent; background: #f0f3f4;"></div>

        <button class="btn-action btn-success" onclick="checkScramble()">Kiểm tra</button>
        <button class="btn-action btn-warning" onclick="loadScramble()">Bỏ qua ➡️</button>
        <div id="scramble-result" style="font-weight: bold; margin-top: 15px; font-size: 18px;"></div>
    </div>

    <script>
        // --- THAY LINK API MỚI VÀO ĐÂY ---
        const API_URL = "https://script.google.com/macros/s/AKfycbw5kiYiSlgNf47zD7WYc4rHjHFiGqy8C1hMS91djNfR1oe-qTXCMq5gc66xVJSicNDg/exec"; 
        
        let bookData = [];
        let currentBookItem = {};

        // 1. TẢI DỮ LIỆU (API MỚI TRẢ VỀ {vocab: [], books: []})
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                // Lấy mảng sách từ API
                bookData = data.books || [];
                document.getElementById('loading').style.display = 'none';
                if(bookData.length === 0) {
                    alert("Chưa có dữ liệu Sách. Hãy vào Google Sheets tab 'Books' để thêm dữ liệu nhé!");
                }
            });

        // HÀM ĐIỀU HƯỚNG
        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
            
            if(screenId === 'screen-book-cloze') loadCloze();
            if(screenId === 'screen-book-trigger') loadTrigger();
            if(screenId === 'screen-book-scramble') loadScramble();
        }

        function getRandomBook() { return bookData[Math.floor(Math.random() * bookData.length)]; }

        // ==========================================
        // PP1: ĐIỀN KHUYẾT (CLOZE DELETION)
        // ==========================================
        function loadCloze() {
            currentBookItem = getRandomBook();
            let sentence = currentBookItem.sentence;
            let keyword = currentBookItem.keyword;
            
            // Thay thế từ khóa bằng dấu gạch dưới
            // Dùng Regex 'gi' để không phân biệt hoa thường
            let regex = new RegExp(keyword, "gi");
            let clozeSentence = sentence.replace(regex, `<span class="cloze-blank">____</span>`);
            
            document.getElementById('cloze-text').innerHTML = clozeSentence;
            document.getElementById('cloze-input').value = "";
            document.getElementById('cloze-result').innerText = "";
        }

        function checkCloze() {
            let input = document.getElementById('cloze-input').value.trim().toLowerCase();
            let answer = currentBookItem.keyword.toLowerCase();
            
            if(input === answer) {
                document.getElementById('cloze-result').innerHTML = "✅ Chính xác!"; 
                document.getElementById('cloze-result').style.color = "green";
                // Hiện lại câu hoàn chỉnh
                document.getElementById('cloze-text').innerHTML = currentBookItem.sentence;
                setTimeout(loadCloze, 2500);
            } else {
                document.getElementById('cloze-result').innerHTML = `❌ Sai! Gợi ý: Bắt đầu bằng chữ "${currentBookItem.keyword.charAt(0)}"`; 
                document.getElementById('cloze-result').style.color = "red";
            }
        }

        // ==========================================
        // PP2: TỪ KHÓA KÍCH HOẠT (TRIGGER)
        // ==========================================
        function loadTrigger() {
            currentBookItem = getRandomBook();
            document.getElementById('trigger-keyword').innerText = currentBookItem.keyword;
            document.getElementById('trigger-answer').innerText = currentBookItem.sentence;
            
            document.getElementById('trigger-answer').style.display = 'none';
            document.getElementById('btn-show-trigger').style.display = 'block';
            document.getElementById('btn-next-trigger').style.display = 'none';
        }

        function showTriggerAnswer() {
            document.getElementById('trigger-answer').style.display = 'block';
            document.getElementById('btn-show-trigger').style.display = 'none';
            document.getElementById('btn-next-trigger').style.display = 'block';
        }

        // ==========================================
        // PP3: XẾP HÌNH TƯ DUY (SCRAMBLE)
        // ==========================================
        let scrambleWords = [];
        let userSelectedWords = [];

        function loadScramble() {
            currentBookItem = getRandomBook();
            document.getElementById('scramble-result').innerText = "";
            
            // Tách câu thành các từ (dựa vào khoảng trắng)
            let sentence = currentBookItem.sentence.trim();
            scrambleWords = sentence.split(" ");
            userSelectedWords = [];
            
            // Xáo trộn mảng từ
            let shuffledWords = [...scrambleWords].sort(() => Math.random() - 0.5);
            
            renderScramblePool(shuffledWords);
            renderScrambleAnswer();
        }

        function renderScramblePool(words) {
            let pool = document.getElementById('scramble-pool-area');
            pool.innerHTML = '';
            words.forEach((word, index) => {
                let btn = document.createElement('button');
                btn.className = 'word-piece';
                btn.innerText = word;
                btn.onclick = () => selectWord(word, btn);
                pool.appendChild(btn);
            });
        }

        function renderScrambleAnswer() {
            let answerArea = document.getElementById('scramble-answer-area');
            answerArea.innerHTML = '';
            userSelectedWords.forEach((wordObj, index) => {
                let btn = document.createElement('button');
                btn.className = 'word-piece';
                btn.innerText = wordObj.word;
                // Bấm vào từ đã chọn để hủy chọn
                btn.onclick = () => deselectWord(index, wordObj.btnRef);
                answerArea.appendChild(btn);
            });
        }

        function selectWord(word, btnRef) {
            btnRef.style.display = 'none'; // Ẩn nút ở Pool
            userSelectedWords.push({ word: word, btnRef: btnRef });
            renderScrambleAnswer();
        }

        function deselectWord(index, btnRef) {
            btnRef.style.display = 'inline-block'; // Hiện lại nút ở Pool
            userSelectedWords.splice(index, 1); // Xóa khỏi mảng Answer
            renderScrambleAnswer();
        }

        function checkScramble() {
            // Ghép các từ người dùng chọn lại thành câu
            let userSentence = userSelectedWords.map(obj => obj.word).join(" ");
            let correctSentence = currentBookItem.sentence.trim();
            
            if(userSentence === correctSentence) {
                document.getElementById('scramble-result').innerHTML = "✅ Tuyệt vời! Logic rất chuẩn."; 
                document.getElementById('scramble-result').style.color = "green";
                setTimeout(loadScramble, 2500);
            } else {
                document.getElementById('scramble-result').innerHTML = "❌ Chưa đúng thứ tự. Hãy thử lại!"; 
                document.getElementById('scramble-result').style.color = "red";
            }
        }
    </script>
</body>
</html>
